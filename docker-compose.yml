version: "3.8"

services:
  # 1. MySQL
  db_mysql:
    image: mysql:8.0
    container_name: law_mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: legalbot_password
      MYSQL_DATABASE: law_chatbot_db
    ports:
      - "3306:3306"
    volumes:
      - law_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - law_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: law_qdrant_container
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - law_qdrant_data:/qdrant/storage
    networks:
      - law_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. Redis
  redis:
    image: redis:7-alpine
    container_name: law_redis_container
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - law_redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - law_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. Backend API
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: law_backend_container
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db_mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - law_network

  # 5. Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: law_frontend_container
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - law_network

networks:
  law_network:
    driver: bridge

volumes:
  law_mysql_data:
  law_qdrant_data:
  law_redis_data:

